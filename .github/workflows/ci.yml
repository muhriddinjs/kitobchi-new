name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (lint, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://kitobchi:kitobchi@localhost:5432/kitobchi
      UPSTASH_REDIS_REST_URL: https://dummy.upstash.io
      UPSTASH_REDIS_REST_TOKEN: dummy_token
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: kitobchi-listings
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      S3_PUBLIC_URL: http://localhost:9000/kitobchi-listings
      JWT_ACCESS_SECRET: test_access_secret
      JWT_REFRESH_SECRET: test_refresh_secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      OTP_TTL_SECONDS: "120"
      OTP_RESEND_COOLDOWN_SECONDS: "60"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kitobchi
          POSTGRES_PASSWORD: kitobchi
          POSTGRES_DB: kitobchi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kitobchi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run build
      - run: npm run test:e2e

  web:
    name: Web (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
